name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach binaries to releases

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: st-windows-x64.zip
          - name: Linux x64
            os: ubuntu-latest
            artifact: st-linux-x64.tar.gz
          - name: macOS universal
            os: macos-latest
            artifact: st-macos-universal.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libcurl4-openssl-dev zsh

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Test

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: ./build.sh --test

      - name: Build and test (macOS, universal arm64 + x86_64)
        if: runner.os == 'macOS'
        env:
          ST_CMAKE_ARGS: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
        run: |
          ./build.sh --test
          lipo -info build/darwin/st

      - name: Upload test transcripts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ runner.os }}
          path: build/e2e-*.txt
          if-no-files-found: ignore

      # ---------------------------------------------------------------- package + release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE README.md dist/
          case "$RUNNER_OS" in
            Windows)
              cp build/windows/Release/st.exe dist/
              (cd dist && 7z a "../${{ matrix.artifact }}" st.exe LICENSE README.md >/dev/null) ;;
            macOS)
              cp build/darwin/st dist/
              (cd dist && ditto -c -k --sequesterRsrc . "../${{ matrix.artifact }}") ;;
            Linux)
              cp build/linux/st dist/
              tar -czf "${{ matrix.artifact }}" -C dist st LICENSE README.md ;;
          esac
          ls -la "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "SuperTerminal $GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.artifact }}" --clobber
